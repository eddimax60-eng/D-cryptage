<!DOCTYPE html>
<html>
<body style="background:#1e1e2e; color:#fff; text-align:center; padding:30px;">

  <h1>Serveur iSH de Max</h1>
  <p id="txt">Clique sur le bouton pour voir l'image...</p>
  
  <button onclick="voirImage()">Afficher l'image</button>

  <div id="zone-image" style="margin-top:20px;"></div>

  <script>
    function voirImage() {
      document.getElementById('txt').innerText = "Voilà l'image !";
      document.getElementById('zone-image').innerHTML = '<img src="https://i.ibb.co/DPPJ5R9F/IMG-9543.jpg" style="border-radius:12px; max-width:100%; box-shadow:0 4px 10px rgba(0,0,0,0.5);">';
    }
  </script>

</body>
</html>
