<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KAWAZ</title>
  
  <!-- Supabase JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: #0f0c20;
      color: #fff;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Header */
    header {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      padding: 15px;
      text-align: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      position: relative;
    }

    .title {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 2px;
      color: #00d2ff;
    }

    /* Bouton K secrètement cliquable */
    .secret-k {
      background: none;
      border: none;
      color: inherit;
      font: inherit;
      cursor: pointer;
      outline: none;
    }

    /* Zone des messages */
    #chat-container {
      flex: 1;
      padding: 15px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      background: rgba(255, 255, 255, 0.07);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 10px 14px;
      border-radius: 12px;
      max-width: 80%;
      word-break: break-word;
    }

    .message .author {
      font-size: 11px;
      color: #00d2ff;
      margin-bottom: 4px;
      font-weight: bold;
    }

    .message audio {
      margin-top: 5px;
      width: 100%;
      max-width: 250px;
      height: 36px;
    }

    /* Barre de saisie */
    .input-bar {
      padding: 12px;
      background: rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(10px);
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .input-bar input {
      flex: 1;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 10px 14px;
      border-radius: 20px;
      color: #fff;
      outline: none;
    }

    .btn {
      background: #00d2ff;
      border: none;
      color: #000;
      font-weight: bold;
      padding: 10px 16px;
      border-radius: 20px;
      cursor: pointer;
    }

    .btn-vocal {
      background: #ff4757;
      color: #fff;
    }

    /* Pop-up Secrète Membres */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(5px);
      justify-content: center;
      align-items: center;
      z-index: 999;
    }

    .modal-content {
      background: rgba(25, 20, 45, 0.9);
      border: 1px solid rgba(0, 210, 255, 0.3);
      padding: 20px;
      border-radius: 16px;
      width: 85%;
      max-width: 380px;
      position: relative;
    }

    .close-btn {
      position: absolute;
      top: 10px;
      right: 15px;
      font-size: 20px;
      cursor: pointer;
      color: #aaa;
    }

    .member-card {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 12px;
      padding: 8px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 10px;
    }

    .member-card img {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      object-fit: cover;
      border: 1.5px solid #00d2ff;
    }

    .member-info h4 {
      font-size: 14px;
    }

    .member-info p {
      font-size: 11px;
      color: #aaa;
    }
  </style>
</head>
<body>

  <!-- Header avec la lettre K secrètement cliquable -->
  <header>
    <div class="title">
      <button class="secret-k" onclick="toggleSecretModal()">K</button>AWAZ
    </div>
  </header>

  <!-- Zone d'affichage des messages -->
  <div id="chat-container"></div>

  <!-- Barre d'envoi -->
  <div class="input-bar">
    <button class="btn btn-vocal" id="rec-btn" onclick="toggleRecord()">🎙️</button>
    <input type="text" id="msg-input" placeholder="Écrire un message...">
    <button class="btn" onclick="sendTextMessage()">Envoyer</button>
  </div>

  <!-- Pop-up Secrète Membres -->
  <div class="modal" id="secret-modal">
    <div class="modal-content">
      <span class="close-btn" onclick="toggleSecretModal()">&times;</span>
      <h3 style="margin-bottom: 10px; color: #00d2ff; text-align: center;">Membres de la Team KAWAZ</h3>
      
      <!-- Liste des membres -->
      <div class="member-card">
        <img src="https://i.ibb.co/23FCZscg/IMG-9981.jpg" alt="Max">
        <div class="member-info">
          <h4>Max Eddi</h4>
          <p>Fondateur / Lead Project</p>
        </div>
      </div>

      <div class="member-card">
        <img src="https://i.ibb.co/rKW7Z0vt/IMG-9824.jpg" alt="Christ">
        <div class="member-info">
          <h4>Christ</h4>
          <p>Membre de la Team</p>
        </div>
      </div>

      <div class="member-card">
        <img src="https://i.ibb.co/V0vp2zBT/cc7eb9b4-4d8d-417e-9d7f-ba8ba7aba678.jpg" alt="Chams">
        <div class="member-info">
          <h4>Chams</h4>
          <p>Membre de la Team</p>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Configuration Supabase avec tes identifiants
    const SUPABASE_URL = 'https://tpnnrezecriolvmgu.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_n667t4HuOITrCXiO2cjeTA_QjrlM5uD';
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let mediaRecorder;
    let audioChunks = [];
    let isRecording = false;

    // Chargement initial et temps réel des messages
    window.onload = () => {
      loadMessages();
      supabase.channel('public:messages')
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, payload => {
          renderMessage(payload.new);
        })
        .subscribe();
    };

    // Afficher/Masquer la fenêtre secrète
    function toggleSecretModal() {
      const modal = document.getElementById('secret-modal');
      modal.style.display = (modal.style.display === 'flex') ? 'none' : 'flex';
    }

    // Charger les messages depuis Supabase
    async function loadMessages() {
      const { data, error } = await supabase
        .from('messages')
        .select('*')
        .order('created_at', { ascending: true });

      if (!error && data) {
        document.getElementById('chat-container').innerHTML = '';
        data.forEach(renderMessage);
      }
    }

    // Afficher un message à l'écran
    function renderMessage(msg) {
      const container = document.getElementById('chat-container');
      const div = document.createElement('div');
      div.className = 'message';
      
      let html = `<div class="author">${msg.author || 'Anonyme'}</div>`;
      if (msg.content) html += `<div>${msg.content}</div>`;
      if (msg.audio_url) html += `<audio controls src="${msg.audio_url}"></audio>`;
      
      div.innerHTML = html;
      container.appendChild(div);
      container.scrollTop = container.scrollHeight;
    }

    // Envoi de message texte
    async function sendTextMessage() {
      const input = document.getElementById('msg-input');
      const text = input.value.trim();
      if (!text) return;

      input.value = '';
      await supabase.from('messages').insert([{ author: 'Max', content: text }]);
    }

    // Gestion de l'enregistrement vocal
    async function toggleRecord() {
      const recBtn = document.getElementById('rec-btn');
      
      if (!isRecording) {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(stream);
        audioChunks = [];

        mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
        mediaRecorder.onstop = async () => {
          const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
          const fileName = `vocal_${Date.now()}.webm`;

          // Upload dans le bucket 'vocaux'
          const { error: uploadErr } = await supabase.storage.from('vocaux').upload(fileName, audioBlob);
          if (uploadErr) return alert('Erreur upload vocal');

          const { data: urlData } = supabase.storage.from('vocaux').getPublicUrl(fileName);
          await supabase.from('messages').insert([{ author: 'Max', audio_url: urlData.publicUrl }]);
        };

        mediaRecorder.start();
        isRecording = true;
        recBtn.innerText = '⏹️';
      } else {
        mediaRecorder.stop();
        isRecording = false;
        recBtn.innerText = '🎙️';
      }
    }
  </script>
</body>
</html>
