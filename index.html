<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Serveur iSH de Max</title>
  <style>
    body {
      background-color: #000000;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      text-align: center;
      padding: 30px 15px;
      transition: background-color 0.5s ease, color 0.5s ease;
      margin: 0;
      min-height: 100vh;
    }

    h1 {
      color: #0088ff;
      text-decoration: underline;
      font-size: 2.2em;
      margin-bottom: 10px;
    }

    .intro {
      font-size: 1.1em;
      margin-bottom: 30px;
    }

    .question {
      font-size: 1.3em;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .btn-container {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-bottom: 25px;
    }

    .btn-yes {
      background-color: #28a745;
      color: white;
      border: none;
      padding: 12px 28px;
      font-size: 1.1em;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    .btn-no {
      background-color: #dc3545;
      color: white;
      border: none;
      padding: 12px 28px;
      font-size: 1.1em;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    .btn-feliciter {
      background-color: #f39c12;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 1.1em;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 15px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    .img-display {
      max-width: 90%;
      width: 320px;
      border-radius: 12px;
      box-shadow: 0 6px 15px rgba(0,0,0,0.6);
      margin-top: 15px;
    }

    .long-text {
      background: rgba(0, 0, 0, 0.3);
      padding: 20px;
      border-radius: 10px;
      margin: 20px auto 0 auto;
      max-width: 600px;
      text-align: left;
      line-height: 1.6;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
  </style>
</head>
<body>

  <h1>Bonjour l'équipe</h1>
  
  <p class="intro">
    Je suis vraiment super content de vous accueillir sur mon site web ! <br>
    Installez-vous bien, je vais vous faire une petite visite guidée.
  </p>

  <p class="question">Est-ce que vous faites partie de la team ?</p>

  <div class="btn-container">
    <button class="btn-yes" onclick="reponseOui()">Oui</button>
    <button class="btn-no" onclick="reponseNon()">Non</button>
  </div>

  <div id="zone-reponse"></div>

  <script>
    function reponseOui() {
      // Arrière-plan vert foncé
      document.body.style.backgroundColor = "#0b3b17";
      document.body.style.color = "#e2f7e5";

      document.getElementById('zone-reponse').innerHTML = `
        <br>
        <img src="https://i.ibb.co/yBSjMCkd/IMG-9847.jpg" alt="Photo Team" class="img-display">
        <br>
        <button class="btn-feliciter" onclick="afficherFelicitations()">Félicitations</button>
        <div id="zone-texte"></div>
      `;
    }

    function reponseNon() {
      // Arrière-plan rouge foncé
      document.body.style.backgroundColor = "#4a0d0d";
      document.body.style.color = "#fde8e8";

      document.getElementById('zone-reponse').innerHTML = `
        <br>
        <img src="https://i.ibb.co/ZR4J4WZq/IMG-9564.jpg" alt="Photo Non Team" class="img-display">
        <p style="margin-top: 15px; font-weight: bold; font-size: 1.2em;">Dommage ! Seule la vraie team a accès aux privilèges secrets du site.</p>
      `;
    }

    function afficherFelicitations() {
      document.getElementById('zone-texte').innerHTML = `
        <div class="long-text">
          <p><strong>Un énorme bravo à toi !</strong></p>
          <p>Si tu es arrivé jusqu'ici, c'est que tu fais officiellement partie du cercle très fermé de l'équipe.</p>
          <p>C'est un réel plaisir d'avoir des personnes comme vous à mes côtés pour partager cette aventure.</p>
          <p>Ensemble, on avance plus vite, on va plus loin et on réalise des projets de plus en plus lourds.</p>
          <p>Ce site n'est que le tout premier pas d'une très longue série de surprises et de nouveautés.</p>
          <p>Prenez le temps d'explorer, profitez de chaque instant et gardez toujours cette force collective.</p>
          <p>Chaque membre apporte sa touche unique et c'est exactement ce qui fait la solidité du groupe.</p>
          <p>Merci pour votre loyauté, votre soutien, votre présence quotidienne et votre motivation.</p>
          <p>Restez connectés car d'autres fonctionnalités encore plus puissantes arrivent très bientôt.</p>
          <p>Continuez de donner le meilleur de vous-mêmes comme vous le faites toujours.</p>
          <p>Force à toute l'équipe, on est ensemble jusqu'au sommet ! 🔥</p>
        </div>
      `;
    }
  </script>

</body>
</html>
